  <text x="80" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#9aa4b2">Corrected age first. Your baby's own curve.</text>
  <text x="80" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#9aa4b2">No subscription. No account. No upload.</text>

